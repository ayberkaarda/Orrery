name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Accepted risks: the GCC testing PPA supplies unpinned packages, and pip
# packages are version-pinned without hashes. Action tags remain mutable.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: >-
    libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
    libgl1-mesa-dev libglu1-mesa-dev pkg-config
  # tools/check_deps.py needs File API codemodel >= 2.9 (CMake >= 4.1).
  CMAKE_PIN: cmake==4.4.4
  NINJA_PIN: ninja==1.13.2
  # Must match the clang-format used to format the sources (LLVM 22).
  CLANG_FORMAT_PIN: clang-format==22.1.8

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04-gcc-13
            os: ubuntu-22.04
            preset: linux-ci-headless
            cc: gcc-13
            cxx: g++-13
          - name: ubuntu-22.04-clang-17
            os: ubuntu-22.04
            preset: linux-ci-headless
            cc: clang-17
            cxx: clang++-17
          - name: windows-2022-msvc
            os: windows-2022
            preset: ci-headless
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
          if [ "${{ matrix.cc }}" = "gcc-13" ]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y gcc-13 g++-13
          else
            sudo apt-get install -y ca-certificates curl gnupg
            # LLVM archive key: https://apt.llvm.org/ (Install section).
            # Scope trust to this repository through a dedicated signed-by keyring.
            curl -fsSLo /tmp/llvm-key.asc https://apt.llvm.org/llvm-snapshot.gpg.key
            gpg --batch --yes --dearmor -o /tmp/llvm-key.gpg /tmp/llvm-key.asc
            sudo install -m 644 /tmp/llvm-key.gpg /usr/share/keyrings/llvm-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list
            sudo apt-get update
            sudo apt-get install -y clang-17
          fi
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw "MSVC installation not found" }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars)) { throw "vcvars64.bat not found" }
          $environment = & cmd.exe /d /s /c "`"`"$vcvars`" >nul && set`""
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name, $value = $Matches[1], $Matches[2]
              if ($name -notmatch '^(GITHUB_|RUNNER_|ACTIONS_)' -and $name -ne 'NODE_OPTIONS') {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMake and Ninja
        shell: bash
        run: |
          python -m pip install "$CMAKE_PIN" "$NINJA_PIN"
          cmake --version
          ninja --version
      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap vcpkg
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
          fi
          cmake --preset ${{ matrix.preset }}
      - name: Dependency boundaries (configured build tree)
        shell: bash
        run: python tools/check_deps.py --build-dir "build/${{ matrix.preset }}"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  asan:
    name: asan (ubuntu-22.04-gcc-13)
    runs-on: ubuntu-22.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS gcc-13 g++-13
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMake and Ninja
        run: |
          python -m pip install "$CMAKE_PIN" "$NINJA_PIN"
          cmake --version
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure
        run: cmake --preset linux-debug-asan
      - name: Dependency boundaries (configured build tree)
        run: python tools/check_deps.py --build-dir build/linux-debug-asan
      - name: Build
        run: cmake --build --preset linux-debug-asan
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset linux-debug-asan --output-on-failure

  lint:
    name: lint (format, tidy, cppcheck, deps)
    runs-on: ubuntu-22.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      CC: clang-17
      CXX: clang++-17
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS cppcheck
          sudo apt-get install -y ca-certificates curl gnupg
          # LLVM archive key: https://apt.llvm.org/ (Install section).
          # Scope trust to this repository through a dedicated signed-by keyring.
          curl -fsSLo /tmp/llvm-key.asc https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --batch --yes --dearmor -o /tmp/llvm-key.gpg /tmp/llvm-key.asc
          sudo install -m 644 /tmp/llvm-key.gpg /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-17 main" | sudo tee /etc/apt/sources.list.d/llvm-17.list
          sudo apt-get update
          sudo apt-get install -y clang-17 clang-tidy-17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CMake, Ninja and clang-format
        run: |
          python -m pip install "$CMAKE_PIN" "$NINJA_PIN" "$CLANG_FORMAT_PIN"
          cmake --version
          clang-format --version
      - name: Dependency boundaries (sources)
        run: python tools/check_deps.py --source-only
      - name: clang-format check
        run: |
          git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' | xargs -r clang-format --dry-run --Werror
      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure (compile database)
        run: cmake --preset linux-ci-headless -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Dependency boundaries (configured build tree)
        run: python tools/check_deps.py --build-dir build/linux-ci-headless
      - name: clang-tidy
        run: |
          test -f build/linux-ci-headless/compile_commands.json
          git ls-files 'src/*.cpp' | xargs -r clang-tidy-17 -p build/linux-ci-headless --quiet
      - name: cppcheck
        run: |
          cppcheck --std=c++20 --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr --suppress=missingIncludeSystem -I src -q src
